# ==========================================
# Nome da aplicacao
# ==========================================
spring.application.name=api-ImuneData

# ==========================================
# H2 Database - banco em arquivo
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/imunedata
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# H2 Console - acesso via navegador
# Acessar em: http://localhost:8080/h2-console
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ==========================================
# Upload de arquivos (para o CSV)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB